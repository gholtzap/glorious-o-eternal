name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ${{ vars.CI_RUNNER_PROVIDER == 'mini' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'mini-macos' || 'macos-15' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check Swift tools
        run: xcrun swift --version
      - name: Test
        run: swift test
      - name: Check the agent interface
        run: |
          .build/debug/model-o-eternal-config capabilities | python3 -m json.tool >/dev/null
          .build/debug/model-o-eternal-config effects | python3 -m json.tool >/dev/null
      - name: Package an ad hoc signed test build
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v6
        with:
          name: Model-O-Eternal-Configuration-macOS-universal
          path: dist/Model-O-Eternal-Configuration-macOS-universal.zip
          if-no-files-found: error
